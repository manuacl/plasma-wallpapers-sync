#
# Two-desktop fixture: a user with a dual-monitor setup has two
# org.kde.plasma.folder containments living in the same activity,
# each carrying its own Image entry. apply() must rewrite both —
# that's the "sync" in the project's name.

[Containments][1]
plugin=org.kde.panel
formfactor=2
wallpaperplugin=org.kde.image

[Containments][2]
plugin=org.kde.plasma.folder
wallpaperplugin=org.kde.image
activityId=a-shared-activity-id
formfactor=0
lastScreen=0

[Containments][2][Wallpaper][org.kde.image][General]
Image=file:///home/test/Pictures/screen0.jpg

[Containments][27]
plugin=org.kde.plasma.folder
wallpaperplugin=org.kde.image
activityId=a-shared-activity-id
formfactor=0
lastScreen=1

[Containments][27][Wallpaper][org.kde.image][General]
Image=file:///home/test/Pictures/screen1.jpg
