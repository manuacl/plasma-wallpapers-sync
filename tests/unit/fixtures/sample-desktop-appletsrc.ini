#
# Minimal plasma-org.kde.plasma.desktop-appletsrc fixture, modeled on
# a real Plasma 6 install:
#   - one panel containment (wallpaperplugin set but no wallpaper subgroup)
#   - one desktop containment using org.kde.plasma.folder (Plasma 6's
#     replacement for the Plasma 5 org.kde.desktopcontainment plugin)
# DesktopSurface detects the desktop by the existence of the
# Wallpaper.org.kde.image.General.Image entry, not by plugin name.

[Containments][1]
plugin=org.kde.panel
formfactor=2
wallpaperplugin=org.kde.image

[Containments][2]
plugin=org.kde.plasma.folder
wallpaperplugin=org.kde.image
activityId=00000000-0000-0000-0000-000000000000
formfactor=0

[Containments][2][Wallpaper][org.kde.image][General]
Image=file:///home/test/Pictures/wallpaper1.jpg
FillMode=2
