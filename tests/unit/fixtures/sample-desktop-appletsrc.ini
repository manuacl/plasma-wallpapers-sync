# Minimal plasma-org.kde.plasma.desktop-appletsrc fixture: one panel
# containment + one desktop containment with an org.kde.image wallpaper.

[Containments][1]
plugin=org.kde.panel
formfactor=2

[Containments][2]
plugin=org.kde.desktopcontainment
wallpaperplugin=org.kde.image
activityId=00000000-0000-0000-0000-000000000000

[Containments][2][Wallpaper][org.kde.image][General]
Image=file:///home/test/Pictures/wallpaper1.jpg
FillMode=2
